{% extends "users/base.html" %}

{% block content %}

</style>

<script>
function setActive(el) { document.querySelectorAll('.topbar-nav-link').forEach(l => l.classList.remove('active')); el.classList.add('active'); }
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.topbar-nav-link').forEach(l => { if (l.getAttribute('href') === window.location.pathname) l.classList.add('active'); });
});

function getCSRF() { return document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''; }

window.toggleNote = function() { document.getElementById('noteBody').classList.toggle('collapsed'); document.querySelector('.note-header').classList.toggle('collapsed'); };
window.toggleNoteDropdown = function(e) { e.stopPropagation(); document.getElementById('noteDropdown').classList.toggle('active'); };
window.clearNote = function() { document.getElementById('dailyNote').value=''; document.getElementById('noteDropdown').classList.remove('active'); htmx.trigger('#dailyNote', 'keyup'); };
document.addEventListener('click', e => { if (!e.target.closest('.note-menu')) document.getElementById('noteDropdown')?.classList.remove('active'); });

window.toggleCompleted = function() {
    const body = document.getElementById('completedBody');
    const icon = document.getElementById('completedIcon');
    if (!body) return;
    body.classList.toggle('collapsed');
    icon.className = body.classList.contains('collapsed') ? 'fas fa-chevron-right' : 'fas fa-chevron-down';
};
window.toggleAllTasks = function(event) {
    if (event) event.stopPropagation();
    const active = document.getElementById('activeTasksContainer');
    const completed = document.getElementById('completedSection');
    const empty = document.getElementById('emptyState');
    const icon = document.getElementById('collapseAllIcon');
    if (!active) return;
    const hidden = active.style.display === 'none';
    active.style.display = hidden ? 'block' : 'none';
    if (completed) completed.style.display = hidden ? 'block' : 'none';
    if (empty) empty.style.display = 'none';
    icon.className = hidden ? 'fas fa-chevron-down' : 'fas fa-chevron-right';
};

let activeDropdown = null;
function createDropdown() {
    let el = document.getElementById('dynamicDropdown');
    if (el) el.remove();
    el = document.createElement('div'); el.id = 'dynamicDropdown'; el.className = 'custom-select-dropdown';
    document.body.appendChild(el); return el;
}
window.toggleCustomSelect = function(event, wrapperId) {
    event.stopPropagation();
    const wrapper = document.getElementById(wrapperId);
    if (!wrapper) return;
    if (wrapper.classList.contains('open')) { closeAllDropdowns(); return; }
    closeAllDropdowns(); wrapper.classList.add('open');
    const trigger = wrapper.querySelector('.custom-select-trigger');
    const dropdown = createDropdown();
    let options = [], currentValue = '', onSelect = null;

    if (wrapperId === 'sortFilterSelectWrapper') {
        options = [{ value:'time', label:'По времени' }, { value:'priority', label:'По важности' }];
        currentValue = document.getElementById('sortFilterLabel').textContent === 'По времени' ? 'time' : 'priority';
        onSelect = (v,l) => { document.getElementById('sortFilterLabel').textContent = l; sortTasks(v); };
    } else if (wrapperId === 'prioritySelectWrapper') {
        options = [{ value:'none', label:'Без уровня', cssClass:'priority-none' }, { value:'urgent', label:'Срочный', cssClass:'priority-urgent' }, { value:'important', label:'Важный', cssClass:'priority-important' }];
        onSelect = (v,l) => { document.getElementById('priorityLabel').textContent=l; document.getElementById('priorityValue').value=v; document.getElementById('priorityLabel').style.color=v==='urgent'?'#ff4d4d':(v==='important'?'#f0c040':''); };
    } else if (wrapperId === 'repeatSelectWrapper') {
        options = [{ value:'none', label:'Не повторять' }, { value:'daily', label:'Ежедневно' }, { value:'weekly', label:'Еженедельно' }, { value:'weekdays', label:'По будням' }];
        onSelect = (v,l) => { document.getElementById('repeatLabel').textContent=l; document.getElementById('repeatValue').value=v; };
    } else if (wrapperId === 'habitRepeatSelectWrapper') {
        options = [
            { value:'daily', label:'Ежедневно' },
            { value:'weekly', label:'Еженедельно' },
            { value:'weekdays', label:'По будням' },
        ];
        onSelect = (v,l) => {
            document.getElementById('habitRepeatLabel').textContent = l;
            document.getElementById('habitRepeatValue').value = v;  // ← вот эта строка должна быть
        };
    }

    dropdown.innerHTML = options.map(o => `<div class="custom-option${o.value===currentValue?' active':''}${o.cssClass?' '+o.cssClass:''}" data-value="${o.value}">${o.label}</div>`).join('');
    dropdown.querySelectorAll('.custom-option').forEach(opt => { opt.addEventListener('click', function(e) { e.stopPropagation(); if (onSelect) onSelect(this.dataset.value, this.textContent); closeAllDropdowns(); }); });
    const rect = trigger.getBoundingClientRect();
    dropdown.style.cssText = `position:fixed;top:${rect.bottom+4}px;left:${rect.left}px;width:${rect.width}px;max-height:240px;`;
    dropdown.classList.add('active'); activeDropdown = { wrapper, dropdown };
};
function closeAllDropdowns() { if (activeDropdown) { activeDropdown.wrapper.classList.remove('open'); activeDropdown.dropdown.remove(); activeDropdown=null; } }
document.addEventListener('click', e => { if (!e.target.closest('.custom-select-wrapper')) closeAllDropdowns(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeAllDropdowns(); });

function sortTasks(sort) {
    const container = document.getElementById('activeTasksContainer');
    if (!container) return;
    const cards = Array.from(container.querySelectorAll('.task-card'));
    if (!cards.length) return;
    cards.sort((a, b) => {
        if (sort === 'priority') {
            const getP = el => el.classList.contains('priority-urgent')?0:el.classList.contains('priority-important')?1:2;
            return getP(a)-getP(b);
        }
        const getTime = el => { const t = el.querySelector('.task-card-time'); return t ? t.textContent.replace(/[🕛]/g,'').trim() : '99:99'; };
        return getTime(a).localeCompare(getTime(b));
    });
    cards.forEach(c => container.appendChild(c));
}

window.openModal = function(id) { const el = document.getElementById(id); if (el) el.classList.add('active'); };
window.closeModal = function(id) { const el = document.getElementById(id); if (!el) return; el.classList.remove('active'); closeAllDropdowns(); };
window.toggleTimeFields = function() { const h = document.getElementById('hasTime').checked; document.getElementById('timeFields').style.display=h?'flex':'none'; if(!h){document.getElementById('taskTimeStart').value='';document.getElementById('taskTimeEnd').value='';} };
window.toggleNotificationFields = function() { const h = document.getElementById('hasNotification').checked; document.getElementById('notificationFields').style.display=h?'flex':'none'; if(!h)document.getElementById('taskNotificationTime').value=''; };
window.toggleRescheduleTimeFields = function() { const h = document.getElementById('rescheduleHasTime').checked; document.getElementById('rescheduleTimeFields').style.display=h?'flex':'none'; };

window.openAddTaskModal = function() {
    document.getElementById('modalTaskTitle').textContent='Новая задача';
    document.getElementById('taskTitle').value=''; document.getElementById('taskDescription').value='';
    document.getElementById('taskDate').value = document.querySelector('#noteForm input[name="date"]')?.value || '';
    document.getElementById('editingTaskId').value='';
    document.getElementById('hasTime').checked=false; document.getElementById('timeFields').style.display='none';
    document.getElementById('hasNotification').checked=false; document.getElementById('notificationFields').style.display='none';
    document.getElementById('taskTimeStart').value=''; document.getElementById('taskTimeEnd').value=''; document.getElementById('taskNotificationTime').value='';
    document.getElementById('priorityLabel').textContent='Без уровня'; document.getElementById('priorityLabel').style.color='';
    document.getElementById('repeatLabel').textContent='Не повторять';
    document.getElementById('priorityValue').value='none'; document.getElementById('repeatValue').value='none';
    openModal('modalTask'); setTimeout(()=>document.getElementById('taskTitle').focus(),100);
};
window.openEditTaskModal = function(taskId) {
    const card = document.getElementById(`task-${taskId}`); 
    if (!card) return;
    
    document.getElementById('modalTaskTitle').textContent = 'Редактировать задачу';
    document.getElementById('taskTitle').value = card.querySelector('.task-card-title').textContent;
    document.getElementById('taskDescription').value = card.querySelector('.task-card-desc')?.textContent || '';
    document.getElementById('editingTaskId').value = taskId;
    
    document.getElementById('taskDate').value = document.querySelector('#noteForm input[name="date"]')?.value || '';
    
    const timeEl = card.querySelector('.task-card-time:not([style*="64a0dc"])');
    if (timeEl) {
        document.getElementById('hasTime').checked = true;
        document.getElementById('timeFields').style.display = 'flex';
        const timeText = timeEl.textContent.replace('🕛 ', '').trim();
        const parts = timeText.split(' — ');
        document.getElementById('taskTimeStart').value = parts[0] || '';
        document.getElementById('taskTimeEnd').value = parts[1] || '';
    } else {
        document.getElementById('hasTime').checked = false;
        document.getElementById('timeFields').style.display = 'none';
        document.getElementById('taskTimeStart').value = '';
        document.getElementById('taskTimeEnd').value = '';
    }
    
    const notifEl = card.querySelector('.task-card-time[style*="64a0dc"]');
    if (notifEl) {
        document.getElementById('hasNotification').checked = true;
        document.getElementById('notificationFields').style.display = 'flex';
        document.getElementById('taskNotificationTime').value = notifEl.textContent.replace(/[🔔\s]/g, '').trim();
    } else {
        document.getElementById('hasNotification').checked = false;
        document.getElementById('notificationFields').style.display = 'none';
        document.getElementById('taskNotificationTime').value = '';
    }
    
    if (card.classList.contains('priority-urgent')) {
        document.getElementById('priorityLabel').textContent = 'Срочный';
        document.getElementById('priorityLabel').style.color = '#ff4d4d';
        document.getElementById('priorityValue').value = 'urgent';
    } else if (card.classList.contains('priority-important')) {
        document.getElementById('priorityLabel').textContent = 'Важный';
        document.getElementById('priorityLabel').style.color = '#f0c040';
        document.getElementById('priorityValue').value = 'important';
    } else {
        document.getElementById('priorityLabel').textContent = 'Без уровня';
        document.getElementById('priorityLabel').style.color = '';
        document.getElementById('priorityValue').value = 'none';
    }
    
    const repeatEl = card.querySelector('.task-card-repeat-badge');
    if (repeatEl) {
        const repeatText = repeatEl.textContent.trim();
        if (repeatText.includes('Ежедневно')) {
            document.getElementById('repeatLabel').textContent = 'Ежедневно';
            document.getElementById('repeatValue').value = 'daily';
        } else if (repeatText.includes('Еженедельно')) {
            document.getElementById('repeatLabel').textContent = 'Еженедельно';
            document.getElementById('repeatValue').value = 'weekly';
        } else if (repeatText.includes('По будням')) {
            document.getElementById('repeatLabel').textContent = 'По будням';
            document.getElementById('repeatValue').value = 'weekdays';
        }
    } else {
        document.getElementById('repeatLabel').textContent = 'Не повторять';
        document.getElementById('repeatValue').value = 'none';
    }
    
    openModal('modalTask');
    setTimeout(() => document.getElementById('taskTitle').focus(), 100);
};
window.openDeleteTaskModal = function(taskId) {
    const card = document.getElementById(`task-${taskId}`); if (!card) return;
    document.getElementById('deleteTaskTitle').textContent = card.querySelector('.task-card-title').textContent;
    document.getElementById('deleteTaskId').value = taskId; document.getElementById('deleteMode').value = 'single';
    const hasRepeat = card.querySelector('.task-card-repeat-badge');
    document.getElementById('deleteSingleAction').style.display = hasRepeat ? 'none' : 'flex';
    document.getElementById('deleteRepeatingActions').style.display = hasRepeat ? 'flex' : 'none';
    document.getElementById('deleteTaskRepeat').textContent = hasRepeat ? 'Повторяется' : 'Обычная задача';
    openModal('modalDeleteTask');
};
window.openRescheduleModal = function(taskId) {
    document.getElementById('rescheduleTaskId').value = taskId;
    document.getElementById('rescheduleHasTime').checked = false; document.getElementById('rescheduleTimeFields').style.display = 'none';
    document.querySelectorAll('.reschedule-option').forEach(o=>o.classList.remove('active'));
    openModal('modalReschedule');
};
window.setQuickReschedule = function(option) {
    const d = new Date(); d.setDate(d.getDate()+(option==='tomorrow'?1:option==='nextWeek'?7:30));
    document.getElementById('rescheduleDate').value = d.toISOString().split('T')[0];
    document.querySelectorAll('.reschedule-option').forEach(o=>o.classList.remove('active'));
    window.event?.target?.closest('.reschedule-option')?.classList.add('active');
};
window.openViewTaskModal = function(taskId) {
    const card = document.getElementById(`task-${taskId}`); if (!card) return;
    document.getElementById('viewTaskId').value = taskId;
    document.getElementById('viewTaskTitle').textContent = card.querySelector('.task-card-title').textContent;
    document.getElementById('viewTaskDescription').textContent = card.querySelector('.task-card-desc')?.textContent || 'Нет описания';
    const pEl = document.getElementById('viewTaskPriority');
    if (card.classList.contains('priority-urgent')) { pEl.textContent='Срочный'; pEl.style.background='rgba(255,77,77,0.15)'; pEl.style.color='#ff4d4d'; }
    else if (card.classList.contains('priority-important')) { pEl.textContent='Важный'; pEl.style.background='rgba(240,192,64,0.15)'; pEl.style.color='#f0c040'; }
    else { pEl.textContent='Без уровня'; pEl.style.background='rgba(255,255,255,0.05)'; pEl.style.color='#B0B0C0'; }
    openModal('modalViewTask');
};

window.toggleTask = function(taskId) {
    const card = document.getElementById(`task-${taskId}`);
    if (!card) return;
    fetch(`/planner/day/task/${taskId}/toggle/`, { method:'POST', headers:{'X-CSRFToken':getCSRF()} })
    .then(r=>r.json()).then(data=>{
        if (data.completed) {
            card.querySelector('.task-card-checkbox').classList.add('checked');
            card.querySelector('.task-card-checkbox').textContent='✓';
            card.classList.add('completed');
            document.getElementById('completedTasksContainer').prepend(card);
        } else {
            card.querySelector('.task-card-checkbox').classList.remove('checked');
            card.querySelector('.task-card-checkbox').textContent='';
            card.classList.remove('completed');
            document.getElementById('activeTasksContainer').appendChild(card);
        }
        updateStats(); updateEmptyState();
    });
};

let activeTaskDropdown = null;
window.toggleTaskMenu = function(event, taskId) {
    event.stopPropagation();
    if (activeTaskDropdown) { activeTaskDropdown.classList.remove('active'); if (activeTaskDropdown.dataset.taskId==taskId) { activeTaskDropdown=null; return; } }
    const dropdown = document.getElementById(`task-dropdown-${taskId}`);
    if (dropdown) { dropdown.classList.add('active'); activeTaskDropdown = dropdown; }
};
document.addEventListener('click', function(e) { if (activeTaskDropdown && !e.target.closest('.task-card-actions')) { activeTaskDropdown.classList.remove('active'); activeTaskDropdown=null; } });

function updateStats() {
    const cc = document.getElementById('completedCount'); if (!cc) return;
    const done = document.querySelectorAll('#completedTasksContainer .task-card').length;
    const total = document.querySelectorAll('#activeTasksContainer .task-card, #completedTasksContainer .task-card').length;
    cc.textContent = done+'/'+total;
    document.getElementById('productivityPercent').textContent = total ? Math.round(done/total*100)+'%' : '0%';
    document.getElementById('urgentCount').textContent = document.querySelectorAll('.task-card.priority-urgent').length;
    document.getElementById('importantCount').textContent = document.querySelectorAll('.task-card.priority-important').length;
    document.getElementById('noneCount').textContent = document.querySelectorAll('.task-card.priority-none').length;
    document.getElementById('completedTasksCount').textContent = done;
    const cs = document.getElementById('completedSection');
    if (cs) cs.style.display = done > 0 ? 'block' : 'none';
}
function updateEmptyState() {
    const empty = document.getElementById('emptyState'); if (!empty) return;
    const total = document.querySelectorAll('#activeTasksContainer .task-card, #completedTasksContainer .task-card').length;
    empty.style.display = total === 0 ? 'block' : 'none';
}
function distributeTasks() {
    const container = document.getElementById('tasksScrollArea');
    if (!container) return;
    const cards = container.querySelectorAll('.task-card');
    const active = document.getElementById('activeTasksContainer');
    const completed = document.getElementById('completedTasksContainer');
    if (!active || !completed) return;
    active.innerHTML = ''; completed.innerHTML = '';
    cards.forEach(card => {
        if (card.classList.contains('completed')) completed.appendChild(card);
        else active.appendChild(card);
    });
    updateStats(); updateEmptyState();
}

window.selectAvatar = function(el) {
    el.parentElement.querySelectorAll('.avatar-option').forEach(a => a.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('habitAvatarValue').value = el.textContent;  // ← добавить
};
window.toggleHabitNotificationFields = function() { document.getElementById('habitNotificationFields').style.display = document.getElementById('habitHasNotification').checked?'block':'none'; };
window.toggleEditHabitNotification = function() { document.getElementById('editHabitNotificationFields').style.display = document.getElementById('editHabitHasNotification').checked?'block':'none'; };
window.toggleExpandable = function(id) { const el = document.getElementById(id); const t = el.previousElementSibling.querySelector('span'); if (el.style.display==='none') { el.style.display='block'; t.textContent=t.textContent.replace('+','−'); } else { el.style.display='none'; t.textContent=t.textContent.replace('−','+'); } };
let activeHabitDropdown = null;
window.toggleHabitMenu = function(event, habitId) {
    event.stopPropagation();
    if (activeHabitDropdown) { activeHabitDropdown.remove(); if (activeHabitDropdown._habitId===habitId) { activeHabitDropdown=null; return; } activeHabitDropdown=null; }
    const btn = event.currentTarget; const rect = btn.getBoundingClientRect();
    const dropdown = document.createElement('div'); dropdown._habitId = habitId;
    dropdown.style.cssText = `position:fixed;top:${rect.bottom+4}px;right:${window.innerWidth-rect.right}px;width:180px;background:#1A1A20;border-radius:12px;border:1px solid rgba(255,255,255,0.08);box-shadow:0 10px 25px rgba(0,0,0,0.6);z-index:9999;overflow:hidden;`;
    dropdown.innerHTML = `
        <div class="task-dropdown-item" onclick="openViewHabitModal(${habitId})" style="padding:10px 14px;font-size:13px;color:#E1E1E6;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.03);"><i class="fas fa-eye" style="width:16px;font-size:13px;"></i> Просмотр</div>
        <div class="task-dropdown-item" onclick="openEditHabitModal(${habitId})" style="padding:10px 14px;font-size:13px;color:#E1E1E6;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.03);"><i class="fas fa-pen" style="width:16px;font-size:13px;"></i> Редактировать</div>
        <div class="task-dropdown-item delete-item" onclick="openDeleteHabitModal(${habitId})" style="padding:10px 14px;font-size:13px;color:#E1E1E6;cursor:pointer;display:flex;align-items:center;gap:10px;"><i class="fas fa-trash-alt" style="width:16px;font-size:13px;"></i> Удалить</div>`;
    const items = dropdown.querySelectorAll('.task-dropdown-item');
    items[0].addEventListener('mouseenter', function(){this.style.background='rgba(224,122,95,0.1)';this.style.color='#E07A5F';}); items[0].addEventListener('mouseleave', function(){this.style.background='';this.style.color='#E1E1E6';});
    items[1].addEventListener('mouseenter', function(){this.style.background='rgba(224,122,95,0.1)';this.style.color='#E07A5F';}); items[1].addEventListener('mouseleave', function(){this.style.background='';this.style.color='#E1E1E6';});
    items[2].addEventListener('mouseenter', function(){this.style.background='rgba(255,77,77,0.1)';this.style.color='#ff4d4d';}); items[2].addEventListener('mouseleave', function(){this.style.background='';this.style.color='#E1E1E6';});
    document.body.appendChild(dropdown); activeHabitDropdown = dropdown;
};
window.toggleHabit = function(habitId) {
    const dateEl = document.getElementById('habitsDate');
    const date = dateEl ? dateEl.dataset.iso : '';
    fetch(`/planner/habits/habit/${habitId}/toggle/?date=${date}`, {
        method: 'POST',
        headers: {'X-CSRFToken': getCSRF()}
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'ok') {
            const card = document.getElementById(`habit-${habitId}`);
            if (card) {
                card.classList.toggle('completed', data.completed);
                const checkbox = card.querySelector('.habit-check-square');
                if (checkbox) {
                    checkbox.classList.toggle('checked', data.completed);
                    checkbox.textContent = data.completed ? '✓' : '';
                }
            }
            updateHabitsStats();
        }
    });
};
window.openViewHabitModal = function(habitId) {
    if (activeHabitDropdown) { activeHabitDropdown.remove(); activeHabitDropdown = null; }
    const card = document.getElementById(`habit-${habitId}`);

    document.getElementById('viewHabitId').value = habitId;

    document.getElementById('viewHabitDescription').textContent = card.dataset.description || 'Нет описания';
    document.getElementById('viewHabitMotivation').textContent = card.dataset.motivation || '';
    document.getElementById('viewHabitRepeat').textContent = card.dataset.repeat || '';
    document.getElementById('viewHabitTime').textContent = card.dataset.time || '';
    document.getElementById('viewHabitStreak').textContent = card.dataset.streak || '0';
    document.getElementById('viewHabitBestStreak').textContent = card.dataset.bestStreak || '0';
    document.getElementById('viewHabitRate').textContent = (card.dataset.rate || '0') + '%';
    
    if (!card.dataset.motivation) {
        document.getElementById('viewHabitMotivation').style.display = 'none';
    } else {
        document.getElementById('viewHabitMotivation').style.display = '';
    }
    
    openModal('modalViewHabit');
};

window.openEditHabitModal = function(habitId) {
    if (activeHabitDropdown) { activeHabitDropdown.remove(); activeHabitDropdown = null; }
    const card = document.getElementById(`habit-${habitId}`);
    if (!card) return;
    
    document.getElementById('modalHabitTitle').textContent = 'Редактировать привычку';
    document.getElementById('habitId').value = habitId;
    const fullName = card.querySelector('.habit-name').textContent;
    const avatar = card.dataset.avatar || '';
    document.getElementById('habitTitle').value = fullName.replace(avatar, '').trim();
    document.getElementById('habitDescription').value = card.dataset.description || '';
    document.getElementById('habitTime').value = card.dataset.time || '';
    document.getElementById('habitMotivation').value = card.dataset.motivation || '';
    document.getElementById('habitNotificationTime').value = card.dataset.notificationTime || '';

        a.classList.toggle('selected', a.textContent === (card.dataset.avatar || '🏃'));
    });
    
    document.getElementById('habitSubmitBtn').textContent = 'Сохранить';

};

window.updateHabitsStats = function() {

        document.querySelectorAll('.habit-card.completed').length : 
        document.querySelectorAll('.habit-card.completed').length;

    const streaks = Array.from(document.querySelectorAll('.habit-card')).map(card => 
        parseInt(card.dataset.bestStreak) || 0
    );
    const maxStreak = streaks.length > 0 ? Math.max(...streaks) : 0;

const calendarState={currentYear:2026,currentMonth:4,selectedDay:null,monthData:{}};
(function(){const y=calendarState.currentYear,m=calendarState.currentMonth;const dim=new Date(y,m+1,0).getDate();for(let d=1;d<=dim;d++){calendarState.monthData[d]={tasks:Math.floor(Math.random()*8),completed:Math.floor(Math.random()*9),habits:Math.floor(Math.random()*5),habitsDone:Math.floor(Math.random()*6)};}})();
function getLevel(t,c,h,hd){const total=t+h;const done=c+hd;if(total===0)return 0;const r=done/total;if(r===1)return 4;if(r>=0.7)return 3;if(r>=0.4)return 2;return 1;}
function getLevelColor(l){return['rgba(255,255,255,0.03)','#0e4429','#006d32','#26a641','#39d353'][l]||'rgba(255,255,255,0.03)';}
function renderCalendar(){
    const y=calendarState.currentYear,m=calendarState.currentMonth;
    document.getElementById('calendarMonthTitle').textContent=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][m]+' '+y;
    const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),pdim=new Date(y,m,0).getDate();
    const today=new Date();let so=fd===0?6:fd-1,html='';
    for(let i=so-1;i>=0;i--){html+=`<div class="calendar-day-cell other-month"><span class="day-number">${pdim-i}</span></div>`;}
    for(let d=1;d<=dim;d++){const data=calendarState.monthData[d]||{tasks:0,completed:0,habits:0,habitsDone:0};const level=getLevel(data.tasks,data.completed,data.habits,data.habitsDone);let cls='calendar-day-cell';if(d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear())cls+=' today';if(d===calendarState.selectedDay)cls+=' selected';html+=`<div class="${cls}" style="background:${getLevelColor(level)}" onclick="openDayPreview(${d})"><span class="day-number">${d}</span></div>`;}
    document.getElementById('calendarGrid').innerHTML=html;updateCalendarStats();renderMiniChart();
}
function updateCalendarStats(){const dim=new Date(calendarState.currentYear,calendarState.currentMonth+1,0).getDate();let tt=0,tc=0,bd=0,bc=0,dw=0;for(let d=1;d<=dim;d++){const data=calendarState.monthData[d];if(data&&data.tasks>0){tt+=data.tasks;tc+=data.completed;dw++;if(data.completed>bc){bc=data.completed;bd=d;}}}document.getElementById('calendarProductivity').textContent=tt>0?Math.round((tc/tt)*100)+'%':'0%';const mn=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][calendarState.currentMonth];document.getElementById('calendarBestDay').textContent=bd>0?bd+' '+mn:'—';document.getElementById('calendarAvgTasks').textContent=dw>0?(tt/dw).toFixed(1):'0';}
function renderMiniChart(){}
window.changeCalendarMonth = function(d){calendarState.currentMonth+=d;if(calendarState.currentMonth<0){calendarState.currentMonth=11;calendarState.currentYear--;}else if(calendarState.currentMonth>11){calendarState.currentMonth=0;calendarState.currentYear++;}calendarState.selectedDay=null;calendarState.monthData={};const dim=new Date(calendarState.currentYear,calendarState.currentMonth+1,0).getDate();for(let d=1;d<=dim;d++){calendarState.monthData[d]={tasks:Math.floor(Math.random()*8),completed:Math.floor(Math.random()*9),habits:Math.floor(Math.random()*5),habitsDone:Math.floor(Math.random()*6)};}renderCalendar();};
window.openMonthPicker = function(){const i=document.createElement('input');i.type='month';i.value=`${calendarState.currentYear}-${String(calendarState.currentMonth+1).padStart(2,'0')}`;i.style.cssText='position:fixed;top:-100px;left:0;opacity:0;pointer-events:none;';document.body.appendChild(i);i.addEventListener('change',function(){if(this.value){const[y,m]=this.value.split('-');calendarState.currentYear=parseInt(y);calendarState.currentMonth=parseInt(m)-1;calendarState.selectedDay=null;calendarState.monthData={};const dim=new Date(calendarState.currentYear,calendarState.currentMonth+1,0).getDate();for(let d=1;d<=dim;d++){calendarState.monthData[d]={tasks:Math.floor(Math.random()*8),completed:Math.floor(Math.random()*9),habits:Math.floor(Math.random()*5),habitsDone:Math.floor(Math.random()*6)};}renderCalendar();}this.remove();});i.showPicker?i.showPicker():i.click();};
window.openDayPreview = function(day){const data=calendarState.monthData[day]||{tasks:0,completed:0,habits:0,habitsDone:0};calendarState.selectedDay=day;renderCalendar();const mn=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];document.getElementById('previewDate').textContent=day+' '+mn[calendarState.currentMonth];document.getElementById('previewTasksStat').textContent=data.completed+'/'+data.tasks;document.getElementById('previewHabitsStat').textContent=data.habitsDone+'/'+data.habits;document.getElementById('dayPreview').style.display='flex';document.getElementById('dayPreview')._selectedDay=day;};
document.addEventListener('click',function(e){const p=document.getElementById('dayPreview');if(p&&p.style.display==='flex'&&e.target===p)p.style.display='none';});
