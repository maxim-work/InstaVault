{% extends "users/base.html" %}

{% block content %}
<div id="main-content">
    <div style="display: none;">
        {% csrf_token %}
    </div>
    <div class="register-card">
        <h1 class="register-title">
            <i class="fas fa-brain"></i> 
            InstaVault
        </h1>
        <div class="register-subtitle">Восстановление доступа</div>

        <!-- ШАГ 1: email и код -->
        <div id="step-email-code" class="step">
            <div class="input-group">
                <label class="input-label">Электронная почта</label>
                <div class="input-with-button">
                    <input type="email" class="input-field" id="email-input" name="email" placeholder="your@email.com" autofocus>
                    <button type="button" class="btn-small" id="send-code-btn">Отправить код</button>
                </div>
                <div class="input-error" id="email-error"></div>
            </div>

            <div class="input-group" style="margin-top: 16px;">
                <label class="input-label">Код подтверждения</label>
                <input type="text" class="input-field" id="code-input" name="code" placeholder="6 цифр" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                <div class="input-error" id="code-error"></div>
            </div>

            <div class="button-row">
                <button type="button" class="btn-primary" id="verify-code-btn" disabled>Подтвердить</button>
                <button type="button" class="btn-small" id="cancel-btn">Отмена</button>
            </div>
        </div>

        <!-- ШАГ 2: новый пароль (скрыт) -->
        <div id="step-password" class="step step-hidden">
            <div class="input-group">
                <label class="input-label">Новый пароль</label>
                <div style="position: relative;">
                    <input type="password" class="input-field" id="new-password" name="new_password" placeholder="минимум 8 символов" style="padding-right: 40px;">
                    <span class="password-toggle" onclick="togglePassword('new-password', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="input-error" id="new-password-error"></div>
            </div>

            <div class="input-group">
                <label class="input-label">Подтверждение пароля</label>
                <div style="position: relative;">
                    <input type="password" class="input-field" id="confirm-password" name="confirm_password" placeholder="повторите пароль" style="padding-right: 40px;">
                    <span class="password-toggle" onclick="togglePassword('confirm-password', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="input-error" id="confirm-password-error"></div>
            </div>

            <button type="button" class="btn-primary" id="reset-password-btn" style="width: 100%; margin-top: 16px;" disabled>Сбросить пароль</button>
        </div>

        <div class="footer-links">
            <a hx-get="{% url 'users:login' %}" hx-target="#main-content" hx-push-url="true">Вход</a>
            <a hx-get="{% url 'users:register' %}" hx-target="#main-content" hx-push-url="true">Регистрация</a>
        </div>
    </div>

    <style>
        .input-error { color: #ff4d4d; font-size: 12px; margin-top: 4px; min-height: 18px; }
        .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #B0B0C0; font-size: 18px; transition: color 0.2s; z-index: 2; }
        .password-toggle:hover { color: #E07A5F; }
        .step { display: block; }
        .step-hidden { display: none; }

        #step-email-code .input-with-button { align-items: stretch; }
        #step-email-code .input-with-button .btn-small {
            height: 48px; min-width: 140px; padding: 0 12px; border-radius: 14px;
            font-size: 14px; font-weight: 600; line-height: 1;
            display: inline-flex; align-items: center; justify-content: center;
            box-sizing: border-box; white-space: nowrap; transition: all 0.2s ease;
        }
        #step-email-code .input-with-button .btn-small:hover { transform: translateY(-2px); }
        #step-email-code .input-with-button .btn-small:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        #step-email-code .button-row { display: flex; gap: 12px; margin-top: 24px; }
        #step-email-code .button-row .btn-primary,
        #step-email-code .button-row .btn-small {
            flex: 1; height: 48px; padding: 0 12px; font-size: 15px; font-weight: 600;
            border-radius: 30px; display: inline-flex; align-items: center; justify-content: center;
            margin-top: 0; line-height: 1; white-space: nowrap; transition: all 0.2s ease;
            cursor: pointer; border: none; box-shadow: none;
        }
        #step-email-code .button-row .btn-primary { background: #E07A5F; color: white; }
        #step-email-code .button-row .btn-small { background: rgba(224, 122, 95, 0.1); border: 1px solid rgba(224, 122, 95, 0.25); color: #E07A5F; }
        #step-email-code .button-row .btn-primary:hover { background: #c96b51; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(224, 122, 95, 0.3); }
        #step-email-code .button-row .btn-small:hover { background: rgba(224, 122, 95, 0.2); border-color: #E07A5F; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(224, 122, 95, 0.3); }
        #step-email-code .button-row .btn-primary:disabled,
        #step-email-code .button-row .btn-small:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        #step-password .btn-primary {
            height: 48px; padding: 0 16px; font-size: 16px; display: inline-flex;
            align-items: center; justify-content: center; margin-top: 16px;
            border-radius: 40px; background: #E07A5F; color: white; border: none;
            box-shadow: none; transition: all 0.2s ease; cursor: pointer; width: 100%;
        }
        #step-password .btn-primary:hover { background: #c96b51; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(224, 122, 95, 0.3); }
        #step-password .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        @media (max-width: 480px) {
            #step-email-code .button-row { flex-direction: column; }
        }
    </style>

    <script>
        window.togglePassword = function(inputId, iconElement) {
            const input = document.getElementById(inputId);
            const icon = iconElement.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        };

        (function() {
            const stepEmailCode = document.getElementById('step-email-code');
            const stepPassword = document.getElementById('step-password');
            const emailInput = document.getElementById('email-input');
            const sendCodeBtn = document.getElementById('send-code-btn');
            const codeInput = document.getElementById('code-input');
            const verifyBtn = document.getElementById('verify-code-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            const newPass = document.getElementById('new-password');
            const confirmPass = document.getElementById('confirm-password');
            const resetBtn = document.getElementById('reset-password-btn');
            const emailError = document.getElementById('email-error');
            const codeError = document.getElementById('code-error');
            const newPassError = document.getElementById('new-password-error');
            const confirmPassError = document.getElementById('confirm-password-error');

            let codeSent = false;
            let codeVerified = false;
            let timerInterval = null;

            function getCsrfToken() {
                const token = document.querySelector('[name=csrfmiddlewaretoken]');
                return token ? token.value : '';
            }

            function isValidEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
            function isValidCode(code) { return /^\d{6}$/.test(code); }

            function validatePassword(password) {
                if (password.length < 8) return false;
                if (!/^[A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+$/.test(password)) return false;
                if (!/[A-Z]/.test(password)) return false;
                if (!/[a-z]/.test(password)) return false;
                if (!/[0-9]/.test(password)) return false;
                if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)) return false;
                return true;
            }

            function getPasswordError(password) {
                if (password.length < 8) return 'Минимум 8 символов';
                if (!/^[A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+$/.test(password)) return 'Только латинские буквы, цифры и спецсимволы';
                if (!/[A-Z]/.test(password)) return 'Нужна заглавная буква';
                if (!/[a-z]/.test(password)) return 'Нужна строчная буква';
                if (!/[0-9]/.test(password)) return 'Нужна цифра';
                if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)) return 'Нужен спецсимвол';
                return '';
            }

            function updateVerifyButton() {
                verifyBtn.disabled = !(isValidCode(codeInput.value.trim()) && codeSent);
            }

            function updateResetButton() {
                const pass = newPass.value;
                const confirm = confirmPass.value;
                let valid = true;

                if (pass && !validatePassword(pass)) {
                    newPassError.innerText = getPasswordError(pass);
                    valid = false;
                } else {
                    newPassError.innerText = '';
                }
                if (confirm && pass !== confirm) {
                    confirmPassError.innerText = 'Пароли не совпадают';
                    valid = false;
                } else {
                    confirmPassError.innerText = '';
                }
                resetBtn.disabled = !(valid && validatePassword(pass) && pass === confirm);
            }

            function startTimer(button, duration) {
                let remaining = duration;
                button.disabled = true;
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    remaining--;
                    if (remaining <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        button.disabled = false;
                        button.textContent = 'Отправить код';
                    } else {
                        const m = Math.floor(remaining / 60);
                        const s = remaining % 60;
                        button.textContent = `Повтор (${m}:${s.toString().padStart(2, '0')})`;
                    }
                }, 1000);
            }

            // Отправить код на почту
            sendCodeBtn.addEventListener('click', function() {
                const email = emailInput.value.trim();
                if (!isValidEmail(email)) { emailError.innerText = 'Введите корректный email'; return; }

                fetch('{% url "users:send_reset_code" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: 'email=' + encodeURIComponent(email)
                })
                .then(r => r.text())
                .then(html => {
                    if (html) {
                        emailError.innerHTML = html;
                    } else {
                        emailError.innerHTML = '';
                        codeSent = true;
                        startTimer(sendCodeBtn, 180);
                        codeInput.focus();
                        updateVerifyButton();
                    }
                });
            });

            codeInput.addEventListener('input', updateVerifyButton);

            // Проверить код
            verifyBtn.addEventListener('click', function() {
                const code = codeInput.value.trim();
                const email = emailInput.value.trim();
                if (!isValidCode(code)) { codeError.innerText = 'Введите 6 цифр'; return; }

                fetch('{% url "users:verify_reset_code" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: 'email=' + encodeURIComponent(email) + '&code=' + encodeURIComponent(code)
                })
                .then(r => r.text())
                .then(html => {
                    if (html.includes('подтверждён') || html.includes('success')) {
                        codeVerified = true;
                        stepEmailCode.style.display = 'none';
                        stepPassword.classList.remove('step-hidden');
                        newPass.focus();
                    } else {
                        codeError.innerHTML = html || 'Неверный код';
                    }
                });
            });

            cancelBtn.addEventListener('click', function() {
                htmx.ajax('GET', '{% url "users:login" %}', {target: '#main-content', pushUrl: true});
            });

            newPass.addEventListener('input', updateResetButton);
            confirmPass.addEventListener('input', updateResetButton);

            // Сбросить пароль
            resetBtn.addEventListener('click', function() {
                const email = emailInput.value.trim();
                const password = newPass.value;
                const passwordConfirm = confirmPass.value;

                if (!validatePassword(password) || password !== passwordConfirm) {
                    updateResetButton();
                    return;
                }

                fetch('{% url "users:reset_password" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: 'email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password) + '&password_confirm=' + encodeURIComponent(passwordConfirm)
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        alert('Пароль изменён. Войдите с новым паролем.');
                        htmx.ajax('GET', '{% url "users:login" %}', {target: '#main-content', pushUrl: true});
                    } else {
                        alert(data.error || 'Ошибка');
                    }
                });
            });

            // Enter
            emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendCodeBtn.click(); } });
            codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!verifyBtn.disabled) verifyBtn.click(); } });
            newPass.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmPass.focus(); } });
            confirmPass.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!resetBtn.disabled) resetBtn.click(); } });

            emailInput.focus();
        })();
    </script>
</div>
{% endblock %}
